<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — SlowShelf</title>
    <link rel="stylesheet" href="main.css">
    <style>
        main { gap: 32px; }
        .back { font-size: 13px; color: #9E8E84; text-decoration: none; }
        .back:hover { color: #2C2420; }
        .contact-box { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .contact-box h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
        .contact-box p { font-size: 15px; color: #7A6A62; line-height: 1.6; max-width: 320px; }
        .email-link { font-size: 15px; color: #2C2420; text-decoration: underline; }
        .email-link:hover { opacity: 0.75; }
    </style>
</head>
<body>
    <main>
        <a class="back" href="index.html">← Home</a>
        <div class="contact-box">
            <div style="font-size:56px">📖</div>
            <h1>SlowShelf</h1>
            <p>For support, feedback, or any questions about the app, email us — we read every message.</p>
            <a class="email-link" href="mailto:cicekoburak@gmail.com">cicekoburak@gmail.com</a>
        </div>
        <footer style="border-top: 1px solid #E8E0D8; padding-top: 24px; width: 100%;">
            <div style="display:flex; gap:10px; font-size:13px; color:#9E8E84;">
                <a href="slowshelf-privacy.html" style="color:#9E8E84; text-decoration:none;">Privacy Policy</a>
            </div>
        </footer>
    </main>
</body>
</html>
